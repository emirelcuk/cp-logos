<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yükleme Kuralları</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-icon"></span>
        <div class="brand-text">
          <b>Yükleme Kuralları</b>
          <span>İstasyon · Rack · Mühimmat</span>
        </div>
      </div>
      <input id="project-name" class="project-name" aria-label="Proje adı" placeholder="Proje adı">
      <div class="actions">
        <button data-action="new"><span>Yeni</span></button>
        <button data-action="open"><span>Aç</span></button>
        <button data-action="save"><span>Kaydet</span></button>
        <button data-action="sample"><span>Örnek</span></button>
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>

  <script src="js/model.js"></script>
  <script src="js/xml-export.js"></script>
  <script src="js/aircraft-shapes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
