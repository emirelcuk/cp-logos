<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout Rules</title>
  <style>
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel-2: #f6f8fb;
  --text: #142033;
  --muted: #64748b;
  --border: #dbe1ea;
  --border-strong: #c3ccd9;
  --accent: #2563eb;
  --accent-2: #1d4ed8;
  --accent-soft: #e8efff;
  --danger: #dc2626;
  --danger-soft: #fdecec;
  --warn: #b45309;
  --warn-soft: #fff4e0;
  --ok: #15803d;
  --ok-soft: #e7f6ec;
  --rack: #7c3aed;
  --subrack: #0e7490;
  --munition: #c2410c;
  --gun: #b91c1c;
  --ammo: #a16207;
  --preset: #0f766e;
  --header: #0b1626;
  --header-2: #13233a;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .05);
  /* drawing (blueprint) */
  --bp-bg: #0a1a2f;
  --bp-grid: rgba(110, 160, 230, .09);
  --bp-grid-major: rgba(110, 160, 230, .18);
  --bp-line: #7fb2ff;
  --bp-loaded: #38bdf8;
  --bp-empty: #94a3b8;
  --bp-gun: #fb923c;
  --bp-select: #fbbf24;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

.icon { width: 16px; height: 16px; flex: none; vertical-align: middle; }

/* ------------------------------------------------------------ top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, var(--header), var(--header-2)); color: #e7eef9; box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
.topbar-row { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #0ea5e9); color: #fff; box-shadow: 0 2px 8px rgba(59, 130, 246, .45); }
.brand-icon .icon { width: 22px; height: 22px; transform: rotate(0deg); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 15px; letter-spacing: .2px; }
.brand-text span { font-size: 11px; color: #8ea3c0; letter-spacing: .4px; text-transform: uppercase; }
.project-name { flex: 1; min-width: 160px; max-width: 340px; background: rgba(255, 255, 255, .06); color: #fff; border: 1px solid rgba(255, 255, 255, .12); margin-left: 8px; }
.project-name:focus { background: rgba(255, 255, 255, .1); border-color: #3b82f6; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.topbar .actions button { background: rgba(255, 255, 255, .06); color: #dbe6f5; border-color: rgba(255, 255, 255, .12); }
.topbar .actions button:hover { background: rgba(255, 255, 255, .14); }

.tabs { display: flex; gap: 4px; padding: 0 16px; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px 8px 0 0; background: none; color: #9fb3cf; padding: 9px 14px 10px; white-space: nowrap; font-weight: 500; position: relative; }
.tab:hover { color: #fff; background: rgba(255, 255, 255, .05); filter: none; }
.tab.active { color: var(--text); background: var(--bg); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; line-height: 18px; color: #fff; background: var(--danger); text-align: center; font-weight: 700; }
.badge.warn { background: #d97706; }

main { padding: 18px 20px 40px; max-width: 1600px; margin: 0 auto; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.content { min-width: 0; }

/* ------------------------------------------------------------ panels */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .1px; }
.panel h3 { margin: 0 0 8px; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h2 { flex: 0 1 auto; }
.panel-icon { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.panel-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.nav-panel { position: sticky; top: 112px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.small-text { font-size: 12.5px; }
.grow { flex: 1; }

/* ------------------------------------------------------------ form */
button { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); color: inherit; cursor: pointer; transition: background .12s, border-color .12s, box-shadow .12s; }
button:hover { background: var(--panel-2); border-color: #aab6c7; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid rgba(37, 99, 235, .35); outline-offset: 1px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(37, 99, 235, .3); }
button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { background: var(--panel-2); border-color: var(--border); color: var(--text); }
button.danger { color: var(--danger); }
button.ghost.danger:hover { background: var(--danger-soft); border-color: #f5c2c2; color: var(--danger); }
button.small { padding: 4px 9px; font-size: 12.5px; border-radius: 7px; }
button.small .icon { width: 14px; height: 14px; }
button.icon-only { padding: 6px; }
button.icon-only.small { padding: 4px; }
button.dashed { border-style: dashed; background: transparent; color: var(--muted); }
button.dashed:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
button.gun-btn { color: var(--gun); border-color: #f1c4c4; }
button.gun-btn:hover { background: #fdf0f0; border-color: var(--gun); }

input, select, textarea { font: inherit; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: inherit; width: 100%; transition: border-color .12s, box-shadow .12s; }
input:hover, select:hover, textarea:hover { border-color: var(--border-strong); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); outline: none; }
textarea { resize: vertical; }
label.field { display: block; margin-bottom: 10px; }
label.field > span { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .4px; }
label.field.inline { margin: 0; }
label.field.inline select { width: auto; min-width: 150px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0 14px; }
.search { position: relative; display: flex; align-items: center; }
.search .icon { position: absolute; left: 9px; color: var(--muted); }
.search input { padding-left: 30px; width: 180px; }

/* ------------------------------------------------------------ lists */
.list, .aircraft-list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 9px; }
.list li:hover { background: var(--panel-2); }
.list li.selected { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.count { font-size: 12px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; font-weight: 600; }
.kind-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex: none; }
.kind-dot.munition { background: var(--munition); }
.kind-dot.rack { background: var(--rack); }
.kind-dot.subrack { background: var(--subrack); }
.kind-dot.gun { background: var(--gun); }
.kind-dot.ammo { background: var(--ammo); }
.kind-pill { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

.aircraft-list li { display: flex; gap: 10px; align-items: center; padding: 9px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
.aircraft-list li:hover { background: var(--panel-2); }
.aircraft-list li.selected { background: var(--accent-soft); border-color: #c7d7fb; }
.mini-plane { width: 38px; height: 46px; flex: none; padding: 3px; border-radius: 8px; background: var(--bp-bg); }
.mini-plane path, .mini-plane circle { fill: rgba(127, 178, 255, .25); stroke: var(--bp-line); stroke-width: 12; }
.ac-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.ac-code { font-size: 14px; }
.aircraft-list li.selected .ac-code { color: var(--accent-2); }
.ac-name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-counts { font-size: 11.5px; color: var(--muted); }

/* ------------------------------------------------------------ tables */
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 11.5px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .4px; background: var(--panel-2); position: sticky; top: 0; }
th:first-child { border-top-left-radius: 8px; }
th:last-child { border-top-right-radius: 8px; }
tbody tr:hover td { background: #fafbfd; }
tr.selected td { background: var(--accent-soft) !important; }
tr.clickable { cursor: pointer; }
td input, td select { border-color: transparent; background: transparent; }
td input:hover { border-color: var(--border); background: #fff; }
td input:focus { background: #fff; }
td.num input { max-width: 110px; }
td.code-col input { font-weight: 650; }
.row-actions { width: 1%; white-space: nowrap; text-align: right; }
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
.table-wrap table tr:last-child td { border-bottom: 0; }
.code-cell { width: 1%; white-space: nowrap; }
.code-chip { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 7px; background: #e0ebff; color: var(--accent-2); font-weight: 700; font-size: 13px; }
.code-chip.side { background: #eef3fb; color: #4b6a9b; margin-left: 14px; }
.code-chip.gun { background: #fde8e8; color: var(--gun); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: #bfe6cb; }

/* ------------------------------------------------------------ aircraft info */
.aircraft-info .panel-head h2 { font-size: 18px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: flex; align-items: baseline; gap: 5px; padding: 3px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border); }
.stat b { font-size: 15px; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.err b { color: var(--danger); }
.stat.warn b { color: var(--warn); }

/* ------------------------------------------------------------ drawing */
.stage { display: grid; grid-template-columns: minmax(300px, 460px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1150px) { .stage { grid-template-columns: 1fr; } }
.drawing { position: sticky; top: 112px; }
.svg-frame { border-radius: 10px; overflow: hidden; background: var(--bp-bg); box-shadow: inset 0 0 0 1px rgba(127, 178, 255, .18), inset 0 0 60px rgba(0, 0, 0, .35); }
.aircraft-svg { display: block; width: 100%; max-height: 70vh; touch-action: none; user-select: none; }
.aircraft-svg .grid-minor { fill: none; stroke: var(--bp-grid); stroke-width: 1; }
.aircraft-svg .grid-major { fill: none; stroke: var(--bp-grid-major); stroke-width: 1; }
.aircraft-svg .af-stop-1 { stop-color: rgba(127, 178, 255, .22); }
.aircraft-svg .af-stop-2 { stop-color: rgba(127, 178, 255, .08); }
.aircraft-svg .airframe { fill: url(#airframe-fill); stroke: var(--bp-line); stroke-width: 1.6; stroke-linejoin: round; }
.aircraft-svg .prop { stroke: var(--bp-line); stroke-width: 3; stroke-linecap: round; opacity: .8; }
.aircraft-svg .canopy { fill: rgba(127, 178, 255, .3); stroke: var(--bp-line); stroke-width: 1.2; }
.aircraft-svg .fin { stroke: var(--bp-line); stroke-width: 3.5; stroke-linecap: round; opacity: .85; }
.aircraft-svg .centerline { stroke: rgba(127, 178, 255, .35); stroke-dasharray: 6 6; }
.aircraft-svg .drawing-caption { font: 600 10px/1 ui-monospace, Consolas, monospace; fill: rgba(160, 196, 245, .6); letter-spacing: 1.5px; }
.aircraft-svg .station { cursor: grab; outline: none; }
.aircraft-svg .station.dragging { cursor: grabbing; }
.aircraft-svg .station .hit { fill: transparent; stroke: none; }
.aircraft-svg .station .halo { pointer-events: none; }
.aircraft-svg .station .mark { fill: var(--bp-bg); stroke: var(--bp-empty); stroke-width: 2; stroke-dasharray: 3 2; }
.aircraft-svg .station.loaded .mark { fill: var(--bp-loaded); stroke: #e0f2fe; stroke-width: 1.5; stroke-dasharray: none; filter: drop-shadow(0 0 4px rgba(56, 189, 248, .75)); }
.aircraft-svg .station.gun .mark { stroke: var(--bp-gun); stroke-dasharray: none; }
.aircraft-svg .station.gun.loaded .mark { fill: var(--bp-gun); stroke: #ffedd5; filter: drop-shadow(0 0 4px rgba(251, 146, 60, .75)); }
.aircraft-svg .station.side.loaded .mark { fill: #7dd3fc; }
.aircraft-svg .station:hover .mark { stroke: #fff; stroke-width: 2.5; }
.aircraft-svg .station.selected .mark { stroke: var(--bp-select); stroke-width: 3; stroke-dasharray: none; }
.aircraft-svg .station .halo { fill: none; stroke: var(--bp-select); stroke-width: 1.5; opacity: .7; animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { opacity: .8; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.35); } }
@media (prefers-reduced-motion: reduce) { .aircraft-svg .station .halo { animation: none; } }
.aircraft-svg .station:focus-visible .mark { stroke: var(--bp-select); stroke-width: 3; }
.aircraft-svg .station text { font: 700 12px system-ui, sans-serif; fill: #e6f0ff; paint-order: stroke; stroke: var(--bp-bg); stroke-width: 4px; pointer-events: none; }
.aircraft-svg .station.side text { font-size: 10.5px; fill: #bcd4f5; }
.aircraft-svg .station.gun text { fill: #fed7aa; }
.aircraft-svg .station.selected text { fill: var(--bp-select); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend-hint { margin-left: auto; font-size: 12px; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.dot.loaded { background: var(--bp-loaded); box-shadow: 0 0 0 2px #e0f2fe inset; }
.dot.none { background: #fff; box-shadow: inset 0 0 0 2px var(--bp-empty); }
.dot.gun { background: var(--bp-gun); border-radius: 2px; transform: rotate(45deg) scale(.85); }
.add-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

.map-tooltip { position: fixed; z-index: 50; pointer-events: none; min-width: 170px; max-width: 280px; background: rgba(11, 22, 38, .96); color: #e2ecfa; border: 1px solid rgba(127, 178, 255, .3); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); opacity: 0; transform: translateY(4px); transition: opacity .1s, transform .1s; }
.map-tooltip.show { opacity: 1; transform: none; }
.map-tooltip .tt-head { display: flex; flex-direction: column; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(127, 178, 255, .2); }
.map-tooltip .tt-head span { color: #9fb3cf; font-size: 12px; }
.map-tooltip ul { list-style: none; margin: 0; padding: 0; }
.map-tooltip li { display: flex; align-items: center; gap: 6px; line-height: 1.6; }
.map-tooltip li.more, .map-tooltip .tt-empty { color: #9fb3cf; font-style: italic; }

/* ------------------------------------------------------------ station panel */
.station-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.station-badge { display: grid; place-items: center; min-width: 46px; height: 46px; padding: 0 8px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 2px 8px rgba(37, 99, 235, .3); }
.station-badge.side { background: linear-gradient(135deg, #3b82f6, #7dd3fc); font-size: 16px; }
.station-badge.gun { background: linear-gradient(135deg, #b91c1c, #f97316); font-size: 13px; box-shadow: 0 2px 8px rgba(185, 28, 28, .3); }
.station-title { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.tag { align-self: flex-start; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
.side-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; font-size: 13px; }
.chip-btn { border-radius: 14px; background: var(--accent-soft); border-color: #bcd0fa; color: var(--accent-2); font-weight: 650; }
.section-title { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.section-title h3 { margin: 0; }

/* load tree */
.tree { list-style: none; margin: 0; padding: 0; }
.tree-item { position: relative; margin-bottom: 8px; border: 1px solid var(--border); border-left: 4px solid var(--border-strong); border-radius: 10px; background: var(--panel); }
.tree-item.rack { border-left-color: var(--rack); }
.tree-item.subrack { border-left-color: var(--subrack); }
.tree-item.munition { border-left-color: var(--munition); }
.tree-item.gun { border-left-color: var(--gun); }
.tree-item.ammo { border-left-color: var(--ammo); }
.tree-node { display: flex; align-items: center; gap: 8px; padding: 7px 9px; flex-wrap: wrap; }
.tree-children { margin: 0 9px 9px 18px; padding: 8px 0 0 12px; border-left: 2px dashed var(--border); }
.tree-children .tree-item { background: var(--panel-2); }
.tree-children .tree-children .tree-item { background: #fff; }
.kind { font-size: 10.5px; font-weight: 750; padding: 2px 7px; border-radius: 5px; color: #fff; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
.kind.rack { background: var(--rack); }
.kind.subrack { background: var(--subrack); }
.kind.munition { background: var(--munition); }
.kind.gun { background: var(--gun); }
.kind.ammo { background: var(--ammo); }
.tree-node select { width: auto; flex: 1 1 180px; min-width: 140px; max-width: 340px; }
.qty-field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
input.qty { width: 74px; }
.add-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
.add-buttons .add-rack:hover { color: var(--rack); border-color: var(--rack); background: #f3edff; }
.add-buttons .add-subrack:hover { color: var(--subrack); border-color: var(--subrack); background: #e6f6f9; }
.add-buttons .add-munition:hover { color: var(--munition); border-color: var(--munition); background: #fff1e8; }
.add-buttons .add-gun:hover { color: var(--gun); border-color: var(--gun); background: #fdf0f0; }
.add-buttons .add-ammo:hover { color: var(--ammo); border-color: var(--ammo); background: #fdf6e3; }
.tree-empty { padding: 14px; text-align: center; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
.related { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.related ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.related li { padding: 4px 0; }

/* rules */
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.rule-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.rule-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.rule-no { font-weight: 800; color: var(--muted); font-size: 13px; }
.rule-desc { margin-top: 8px; }
.rule-type { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-2); }
.rule-type.EXCLUSIVE { background: var(--danger-soft); color: var(--danger); }
.rule-type.MAX_TOTAL { background: var(--warn-soft); color: var(--warn); }
.rule-type.REQUIRES { background: var(--ok-soft); color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border: 1px solid var(--border-strong); border-radius: 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none; background: #fff; }
.chip input { width: auto; margin: 0; accent-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }
.chip.gun.on { background: #fdecec; border-color: var(--gun); color: var(--gun); }

/* validation */
.issues { display: flex; flex-direction: column; gap: 8px; }
.issue { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid; }
.issue .icon { width: 18px; height: 18px; margin-top: 1px; }
.issue.error { background: var(--danger-soft); border-color: #f5c2c2; color: #7f1d1d; }
.issue.error .icon { color: var(--danger); }
.issue.warning { background: var(--warn-soft); border-color: #f6dcae; color: #713f12; }
.issue.warning .icon { color: #d97706; }
.issue .where { font-size: 12px; opacity: .8; }
.issue .msg { font-weight: 550; }
.banner { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; }
.banner.error { background: var(--danger-soft); color: var(--danger); border: 1px solid #f5c2c2; }

.empty-state { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-state .icon { width: 30px; height: 30px; opacity: .5; margin-bottom: 4px; }
.empty-state b { color: var(--text); font-weight: 650; }
.empty-state span { font-size: 13px; }

/* XML */
pre.xml { background: #0b1626; color: #cbd8ea; padding: 16px; border-radius: 10px; overflow: auto; max-height: 72vh; margin: 0; font: 12.5px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace; box-shadow: inset 0 0 0 1px rgba(127, 178, 255, .15); }
.x-tag { color: #7dd3fc; }
.x-attr { color: #c4b5fd; }
.x-val { color: #86efac; }
.x-decl { color: #64748b; }

/* toast */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; padding: 10px 16px; border-radius: 10px; background: #0b1626; color: #fff; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; border-left: 4px solid var(--accent); }
.toast.show { opacity: 1; transform: none; }
.toast.ok { border-left-color: #22c55e; }
.toast.error { border-left-color: #ef4444; }

@media (max-width: 860px) {
  .nav-panel, .drawing { position: static; }
  .topbar { position: static; }
  .project-name { margin-left: 0; max-width: none; }
}

/* catalog group filter */
.group-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.group-chip { border-radius: 14px; background: #fff; }
.group-chip .count { margin-left: 2px; }
.group-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); font-weight: 600; }
.catalog-table th:first-child { width: 150px; }
.catalog-table td:nth-child(2) { min-width: 300px; width: 38%; }
.catalog-table td.num { width: 130px; }

/* top bar: undo / file status */
.sep { width: 1px; align-self: stretch; background: rgba(255, 255, 255, .15); margin: 2px 4px; }
.topbar .actions button:disabled { opacity: .35; }
.file-status { font-size: 12px; color: #9fb3cf; padding: 3px 9px; border-radius: 8px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); white-space: nowrap; }
.file-status.dirty { color: #fcd34d; border-color: rgba(252, 211, 77, .35); }
.file-status.hidden { display: none; }

/* presets */
.kind.preset { background: var(--preset); }
.kind-dot.preset { background: var(--preset); border-radius: 50%; }
.tree-item.preset { border-left-color: var(--preset); background: #f0fdfa; }
.preset-summary { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 10px 9px 12px; font-size: 12px; color: var(--muted); }
.preset-item { display: inline-flex; align-items: center; gap: 4px; }
.preset-item.d0 { color: var(--text); font-weight: 600; }
.add-buttons .add-preset:hover { color: var(--preset); border-color: var(--preset); background: #ecfdf8; }
.section-title .grow { flex: 1; }
.section-title { flex-wrap: wrap; }

/* modal */
.modal-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(11, 22, 38, .45); display: grid; place-items: center; padding: 16px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--panel); border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); padding: 18px 20px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.section-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.chip.mirror { border-style: dashed; border-color: var(--accent); }

/* matrix */
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.matrix-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--border); border-radius: 10px; margin-top: 12px; }
table.matrix { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
table.matrix th, table.matrix td { border-bottom: 1px solid var(--border); border-right: 1px solid #eef1f5; padding: 4px 6px; }
table.matrix thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); text-transform: none; letter-spacing: 0; }
table.matrix .corner { left: 0; z-index: 3; font-size: 11px; color: var(--muted); min-width: 220px; }
table.matrix .col-head { text-align: center; min-width: 46px; font-size: 13px; color: var(--accent-2); cursor: pointer; }
table.matrix .col-head:hover { background: var(--accent-soft); }
table.matrix .col-head.side { color: #4b6a9b; font-size: 12px; }
table.matrix .col-head.gun { color: var(--gun); }
table.matrix .row-head { position: sticky; left: 0; z-index: 1; background: #fff; text-align: left; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text); font-size: 13px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.matrix .row-head b { margin-right: 8px; }
table.matrix .row-head span { color: var(--muted); font-size: 12px; }
table.matrix .cell { text-align: center; font-size: 12.5px; }
table.matrix .cell.on { background: #e3f6ea; color: #166534; font-weight: 700; cursor: help; }
table.matrix tbody tr:hover td.cell:not(.on) { background: #fafbfd; }
table.matrix tbody tr:hover .row-head { background: #f3f6fb; }
table.matrix .group-row td { position: sticky; left: 0; background: #f1f4f9; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px 8px; }
table.matrix .group-row .kind-dot { margin-right: 6px; }
.print-title { display: none; }

@media print {
  body { background: #fff; }
  .topbar, .nav-panel, .no-print, .panel-actions, .toast, .map-tooltip { display: none !important; }
  main { padding: 0; max-width: none; }
  .panel { box-shadow: none; border: 0; padding: 0; }
  .print-title { display: block; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .matrix-wrap { max-height: none; overflow: visible; border: 0; }
  table.matrix .cell.on { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.matrix thead th, table.matrix .row-head, table.matrix .group-row td { position: static; }
  .hint { display: none; }
}

<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-icon"></span>
        <div class="brand-text">
          <b>Loadout Rules</b>
          <span>Station · Rack · Store</span>
        </div>
      </div>
      <input id="project-name" class="project-name" aria-label="Project name" placeholder="Project name">
      <span id="file-status" class="file-status hidden"></span>
      <div class="actions">
        <button data-action="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
        <button data-action="redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled></button>
        <span class="sep"></span>
        <button data-action="new"><span>New</span></button>
        <button data-action="open" title="Open a JSON project file"><span>Open</span></button>
        <button data-action="save" title="Save to file (Ctrl+S)"><span>Save</span></button>
        <button data-action="saveas" title="Save as (Ctrl+Shift+S)"><span>Save as</span></button>
        <button data-action="sample"><span>Sample</span></button>
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>

  <script>
/*
 * Data model, sample data and validation.
 * Used as window.LoadoutModel in the browser and via module.exports in Node.
 *
 * Project structure:
 *   catalog.munitions / racks / subracks / guns / ammo : defined stores
 *   presets[]                                          : reusable load trees
 *   aircraft[].stations[].loads                        : load tree allowed on a station
 *   aircraft[].constraints                             : cross-station rules
 *
 * Load tree (LoadNode):
 *   { id, kind: 'rack'|'subrack'|'munition'|'gun'|'ammo'|'preset', refId, qty, children: [LoadNode] }
 *   The children of a node are ALTERNATIVES (any one of them may be fitted).
 *   qty: maximum number of that item on its parent (rounds for gun ammunition).
 *
 * Station types: STATION (numbered station / side station) and GUN (internal gun, unnumbered).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LoadoutModel = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SCHEMA_VERSION = 1;

  const KINDS = ['munition', 'rack', 'subrack', 'gun', 'ammo'];
  const KIND_LABELS = { munition: 'Store', rack: 'Rack', subrack: 'Subrack', gun: 'Gun', ammo: 'Gun ammunition', preset: 'Preset' };
  const CATALOG_KEY = { munition: 'munitions', rack: 'racks', subrack: 'subracks', gun: 'guns', ammo: 'ammo' };
  // Meaning of "positions": mounting points for racks/subracks, round capacity for guns.
  const HAS_POSITIONS = { rack: true, subrack: true, gun: true };

  // What may be fitted under what. Gun pods may hang under a rack.
  const ALLOWED_CHILDREN = {
    station: ['rack', 'subrack', 'munition', 'gun', 'preset'],
    gunStation: ['gun'],
    // Preset contents: same as a station, but no preset inside a preset.
    presetRoot: ['rack', 'subrack', 'munition', 'gun'],
    preset: [],
    rack: ['subrack', 'munition', 'gun'],
    subrack: ['munition'],
    gun: ['ammo'],
    munition: [],
    ammo: [],
  };
  const PARENT_LABELS = { station: 'a station', gunStation: 'a gun station', presetRoot: 'a preset' };

  const STATION_TYPES = { STATION: 'Station', GUN: 'Gun (GUN)' };

  const LOCATIONS = { LEFT: 'Left', CENTER: 'Centre', RIGHT: 'Right' };

  const CONSTRAINT_TYPES = {
    SYMMETRIC: { label: 'Symmetric', help: 'The listed stations must carry the same load.' },
    EXCLUSIVE: { label: 'Mutually exclusive', help: 'At most one of the listed stations may be loaded.' },
    REQUIRES: { label: 'Requires', help: 'If the first station is loaded, the others must be loaded too.' },
    MAX_TOTAL: { label: 'Total limit', help: 'At most N of the selected store in total across the listed stations.' },
  };

  let idCounter = 0;
  function newId(prefix) {
    idCounter += 1;
    return (prefix || 'id') + '_' + Date.now().toString(36) + idCounter.toString(36) +
      Math.random().toString(36).slice(2, 6);
  }

  function emptyProject() {
    return {
      schemaVersion: SCHEMA_VERSION,
      name: 'New Project',
      catalogVersion: 0,
      catalog: emptyCatalog(),
      // Presets: shared load trees used on several stations.
      presets: [],
      aircraft: [],
    };
  }

  function emptyCatalog() {
    const c = {};
    KINDS.forEach(function (k) { c[CATALOG_KEY[k]] = []; });
    return c;
  }

  function newStore(kind) {
    const base = { id: newId(kind), code: '', name: '', notes: '' };
    if (kind === 'munition') return Object.assign(base, { category: '' });
    if (kind === 'ammo') return Object.assign(base, { caliber: '', category: '' });
    if (kind === 'gun') return Object.assign(base, { caliber: '', positions: 500 });
    return Object.assign(base, { positions: 1 });
  }

  function newAircraft() {
    return { id: newId('ac'), code: '', name: '', silhouette: 'single', notes: '', stations: [], constraints: [] };
  }

  function newStation() {
    // code and location are assigned by left-to-right ordering (AircraftShapes.arrangeStations).
    // parentId/suffix: for a side station, its parent station and suffix (e.g. 5 + 'L' = 5L).
    // x, y: position on the aircraft drawing (null = placed automatically).
    return { id: newId('st'), type: 'STATION', code: '', name: '', parentId: null, suffix: '', location: 'CENTER', x: null, y: null, loads: [] };
  }

  function newLoadNode(kind, refId) {
    return { id: newId('ld'), kind: kind, refId: refId || '', qty: 1, children: [] };
  }

  function newConstraint() {
    return { id: newId('cn'), type: 'SYMMETRIC', stationIds: [], munitionId: '', value: 0, description: '' };
  }

  function newPreset() {
    return { id: newId('ps'), code: '', name: '', notes: '', loads: [] };
  }

  function findStore(project, kind, id) {
    const list = kind === 'preset' ? (project.presets || []) : (project.catalog[CATALOG_KEY[kind]] || []);
    return list.find(function (s) { return s.id === id; }) || null;
  }

  function storeLabel(store) {
    if (!store) return '(undefined)';
    return store.code ? store.code + (store.name ? ' — ' + store.name : '') : (store.name || '(unnamed)');
  }

  // Fields from earlier versions that are no longer used.
  const OBSOLETE_FIELDS = ['weightKg', 'maxLoadKg'];
  function stripObsolete(obj) {
    OBSOLETE_FIELDS.forEach(function (k) { delete obj[k]; });
    return obj;
  }

  /* Brings old or incomplete projects up to the current schema. */
  function normalizeProject(p) {
    const out = Object.assign(emptyProject(), p || {});
    out.catalog = Object.assign(emptyCatalog(), out.catalog || {});
    KINDS.forEach(function (kind) {
      out.catalog[CATALOG_KEY[kind]] = out.catalog[CATALOG_KEY[kind]].map(function (s) {
        return stripObsolete(Object.assign(newStore(kind), s));
      });
    });
    // Earlier versions called presets "packages" (kind 'package').
    const legacyPresets = out.packages || [];
    delete out.packages;
    out.presets = (out.presets || []).concat(legacyPresets).map(function (pk) {
      const preset = Object.assign(newPreset(), pk);
      preset.loads = (preset.loads || []).map(normalizeNode);
      return preset;
    });
    out.aircraft = (out.aircraft || []).map(function (a) {
      const ac = Object.assign(newAircraft(), a);
      ac.stations = (ac.stations || []).map(function (s) {
        const st = stripObsolete(Object.assign(newStation(), s));
        st.loads = (st.loads || []).map(normalizeNode);
        return st;
      });
      ac.constraints = (ac.constraints || []).map(function (c) {
        return Object.assign(newConstraint(), c);
      });
      return ac;
    });
    out.schemaVersion = SCHEMA_VERSION;
    return out;
  }

  function normalizeNode(n) {
    const node = Object.assign(newLoadNode(n.kind, n.refId), n);
    if (node.kind === 'package') node.kind = 'preset';
    node.children = (node.children || []).map(normalizeNode);
    return node;
  }

  /* ---------------------------------------------------------------- copying, presets */

  /* Deep copy of a load tree with new ids. */
  function cloneLoads(loads) {
    return (loads || []).map(function (n) {
      return { id: newId('ld'), kind: n.kind, refId: n.refId, qty: n.qty, children: cloneLoads(n.children) };
    });
  }

  /* Replaces preset references with the preset contents (flat rule tree for XML, matrix etc.). */
  function expandLoads(project, loads) {
    const out = [];
    (loads || []).forEach(function (n) {
      if (n.kind === 'preset') {
        const preset = findStore(project, 'preset', n.refId);
        if (preset) cloneLoads(preset.loads).forEach(function (c) { out.push(c); });
        return;
      }
      out.push({ id: n.id, kind: n.kind, refId: n.refId, qty: n.qty, children: expandLoads(project, n.children) });
    });
    return out;
  }

  /* Stations that use a preset: [{ aircraft, station }]. */
  function presetUsage(project, presetId) {
    const out = [];
    project.aircraft.forEach(function (ac) {
      ac.stations.forEach(function (st) {
        if (st.loads.some(function (n) { return n.kind === 'preset' && n.refId === presetId; })) out.push({ aircraft: ac, station: st });
      });
    });
    return out;
  }

  /* Duplicates an aircraft with all its stations, loads and rules under new ids. */
  function duplicateAircraft(ac) {
    const idMap = {};
    const copy = Object.assign(newAircraft(), JSON.parse(JSON.stringify(ac)));
    copy.id = newId('ac');
    copy.code = (ac.code || 'AIRCRAFT') + '-COPY';
    copy.stations = ac.stations.map(function (st) {
      const s = Object.assign({}, JSON.parse(JSON.stringify(st)), { id: newId('st') });
      idMap[st.id] = s.id;
      s.loads = cloneLoads(st.loads);
      return s;
    });
    copy.stations.forEach(function (s) { if (s.parentId) s.parentId = idMap[s.parentId] || null; });
    copy.constraints = ac.constraints.map(function (c) {
      return Object.assign({}, c, {
        id: newId('cn'),
        stationIds: c.stationIds.map(function (id) { return idMap[id]; }).filter(Boolean),
      });
    });
    return copy;
  }

  /*
   * Compatibility matrix: which item fits which station, by which path and at most how many.
   * kinds: kinds shown as rows. Returns { stations, rows: [{ kind, store, cells: { stationId: { qty, paths } } }] }
   */
  function compatibility(project, ac, kinds) {
    const rows = {};
    ac.stations.forEach(function (st) {
      const walk = function (nodes, path, mult) {
        nodes.forEach(function (n) {
          const store = findStore(project, n.kind, n.refId);
          if (!store) return;
          const qty = mult * (Number(n.qty) || 1);
          const label = store.code + (n.qty > 1 ? ' ×' + n.qty : '');
          const here = path.concat([label]);
          if (kinds.indexOf(n.kind) >= 0) {
            const key = n.kind + ':' + store.id;
            const row = rows[key] || (rows[key] = { kind: n.kind, store: store, cells: {} });
            const cell = row.cells[st.id] || (row.cells[st.id] = { qty: 0, paths: [] });
            cell.qty = Math.max(cell.qty, qty);
            cell.paths.push(here.join(' › '));
          }
          walk(n.children || [], here, qty);
        });
      };
      walk(expandLoads(project, st.loads), [], 1);
    });
    const order = function (r) {
      const list = project.catalog[CATALOG_KEY[r.kind]] || [];
      return KINDS.indexOf(r.kind) * 100000 + list.indexOf(r.store);
    };
    return {
      stations: ac.stations,
      rows: Object.keys(rows).map(function (k) { return rows[k]; }).sort(function (a, b) { return order(a) - order(b); }),
    };
  }

  /* ---------------------------------------------------------------- validation */

  function validate(project) {
    const issues = [];
    const add = function (level, where, message) { issues.push({ level: level, where: where, message: message }); };

    KINDS.forEach(function (kind) {
      const list = project.catalog[CATALOG_KEY[kind]] || [];
      const seen = {};
      list.forEach(function (s) {
        const where = KIND_LABELS[kind] + ' ' + storeLabel(s);
        if (!s.code) add('error', where, 'Code must not be empty.');
        else if (seen[s.code]) add('error', where, 'Duplicate code: ' + s.code);
        seen[s.code] = true;
        if (HAS_POSITIONS[kind] && !(Number(s.positions) >= 1)) {
          add('error', where, kind === 'gun' ? 'Round capacity must be at least 1.' : 'Number of positions must be at least 1.');
        }
      });
    });

    const psSeen = {};
    (project.presets || []).forEach(function (preset) {
      const where = 'Preset ' + storeLabel(preset);
      if (!preset.code) add('error', where, 'Code must not be empty.');
      else if (psSeen[preset.code]) add('error', where, 'Duplicate code: ' + preset.code);
      psSeen[preset.code] = true;
      if (!preset.loads.length) add('warning', where, 'Preset is empty.');
      preset.loads.forEach(function (n) { validateNode(project, n, 'presetRoot', null, where, add); });
    });

    const acSeen = {};
    project.aircraft.forEach(function (ac) {
      const acWhere = 'Aircraft ' + (ac.code || '(no code)');
      if (!ac.code) add('error', acWhere, 'Aircraft code must not be empty.');
      else if (acSeen[ac.code]) add('error', acWhere, 'Duplicate aircraft code.');
      acSeen[ac.code] = true;
      if (!ac.stations.length) add('warning', acWhere, 'No stations defined.');
      const stById = {};
      ac.stations.forEach(function (s) { stById[s.id] = s; });

      const stSeen = {};
      ac.stations.forEach(function (st) {
        const stWhere = acWhere + ' / Station ' + (st.code || '(no code)');
        if (!st.code) add('error', stWhere, 'Station code must not be empty.');
        else if (stSeen[st.code]) add('error', stWhere, 'Duplicate station code.');
        stSeen[st.code] = true;
        if (st.parentId) {
          if (!stById[st.parentId]) add('error', stWhere, 'Parent station not found.');
          if (!st.suffix) add('error', stWhere, 'Side station suffix must not be empty.');
        }
        if (!st.loads.length) add('warning', stWhere, 'No loads are allowed on this station yet.');

        const parentKind = st.type === 'GUN' ? 'gunStation' : 'station';
        st.loads.forEach(function (n) { validateNode(project, n, parentKind, null, stWhere, add); });
      });

      const stationIds = {};
      ac.stations.forEach(function (s) { stationIds[s.id] = true; });
      ac.constraints.forEach(function (c, i) {
        const cWhere = acWhere + ' / Rule #' + (i + 1);
        if (!CONSTRAINT_TYPES[c.type]) add('error', cWhere, 'Unknown rule type: ' + c.type);
        const valid = c.stationIds.filter(function (id) { return stationIds[id]; });
        if (valid.length !== c.stationIds.length) add('error', cWhere, 'References a deleted station.');
        if (valid.length < 2) add('error', cWhere, 'Select at least 2 stations.');
        if (c.type === 'MAX_TOTAL') {
          if (!findStore(project, 'munition', c.munitionId)) add('error', cWhere, 'Select a store.');
          if (!(Number(c.value) >= 0)) add('error', cWhere, 'The limit must not be negative.');
        }
      });
    });

    return issues;
  }

  function validateNode(project, node, parentKind, parentStore, where, add) {
    const store = findStore(project, node.kind, node.refId);
    const label = KIND_LABELS[node.kind] + ' ' + storeLabel(store);
    const here = where + ' / ' + label;
    if (ALLOWED_CHILDREN[parentKind].indexOf(node.kind) < 0) {
      add('error', here, KIND_LABELS[node.kind] + ' cannot be fitted under ' + (KIND_LABELS[parentKind] ? 'a ' + KIND_LABELS[parentKind].toLowerCase() : PARENT_LABELS[parentKind]) + '.');
    }
    if (!store) add('error', here, 'References an item that is not in the catalog.');
    if (!(Number(node.qty) >= 1)) add('error', here, 'Quantity must be at least 1.');
    if (parentStore && Number(node.qty) > Number(parentStore.positions)) {
      add('error', here, 'Quantity (' + node.qty + ') exceeds the ' +
        (node.kind === 'ammo' ? 'round capacity (' : 'number of positions (') + parentStore.positions + ') of ' + storeLabel(parentStore) + '.');
    }
    if (store && node.kind === 'ammo' && parentStore && parentStore.caliber && store.caliber &&
        normCaliber(parentStore.caliber) !== normCaliber(store.caliber)) {
      add('warning', here, 'Caliber mismatch: gun ' + parentStore.caliber + ', ammunition ' + store.caliber + '.');
    }
    if (store && ALLOWED_CHILDREN[node.kind].length) {
      if (!(node.children || []).length) add('warning', here, 'Nothing is allowed under it yet.');
    }
    (node.children || []).forEach(function (c) { validateNode(project, c, node.kind, store, where, add); });
  }

  function standardCatalog() {
    const out = emptyCatalog();
    STANDARD_CATALOG.munition.forEach(function (r) {
      out.munitions.push(Object.assign(newStore('munition'), { code: r[0], name: r[1], category: r[2] }));
    });
    ['rack', 'subrack'].forEach(function (kind) {
      STANDARD_CATALOG[kind].forEach(function (r) {
        out[CATALOG_KEY[kind]].push(Object.assign(newStore(kind), { code: r[0], name: r[1], positions: r[2] }));
      });
    });
    STANDARD_CATALOG.gun.forEach(function (r) {
      out.guns.push(Object.assign(newStore('gun'), { code: r[0], name: r[1], caliber: r[2], positions: r[3] }));
    });
    STANDARD_CATALOG.ammo.forEach(function (r) {
      out.ammo.push(Object.assign(newStore('ammo'), { code: r[0], name: r[1], caliber: r[2], category: r[3] }));
    });
    return out;
  }

  /* Adds standard catalog items whose code is not yet in the project; returns the number added. */
  function mergeStandardCatalog(project) {
    const std = standardCatalog();
    let added = 0;
    KINDS.forEach(function (kind) {
      const key = CATALOG_KEY[kind];
      const have = {};
      project.catalog[key].forEach(function (s) { have[s.code] = true; });
      std[key].forEach(function (s) { if (!have[s.code]) { project.catalog[key].push(s); added++; } });
    });
    project.catalogVersion = STANDARD_CATALOG_VERSION;
    return added;
  }

  /*
   * Translates standard catalog entries that still carry the Turkish names/categories of catalog
   * version 2 into English. Entries the user has edited are left alone. Returns the number changed.
   */
  function translateLegacyCatalog(project) {
    const std = standardCatalog();
    let changed = 0;
    KINDS.forEach(function (kind) {
      const key = CATALOG_KEY[kind];
      const byCode = {};
      std[key].forEach(function (s) { byCode[s.code] = s; });
      project.catalog[key].forEach(function (s) {
        const legacy = LEGACY_TR[kind + ':' + s.code];
        const en = byCode[s.code];
        if (!legacy || !en) return;
        let hit = false;
        if (s.name === legacy[0]) { s.name = en.name; hit = true; }
        if (legacy[1] && s.category === legacy[1]) { s.category = en.category; hit = true; }
        if (hit) changed++;
      });
    });
    return changed;
  }

  /* Brings an older project's catalog up to date: translation and missing items. */
  function upgradeCatalog(project) {
    if ((project.catalogVersion || 0) >= STANDARD_CATALOG_VERSION) return { added: 0, translated: 0 };
    const translated = translateLegacyCatalog(project);
    const added = mergeStandardCatalog(project);
    return { added: added, translated: translated };
  }

  // Stations this close to the centre line count as fuselage (CENTER) stations.
  const CENTER_TOLERANCE = 12;

  // Main station: numbered; not a side point and not a gun.
  function isMain(s) { return !s.parentId && s.type !== 'GUN'; }
  function isGun(s) { return s.type === 'GUN'; }

  function placeGuns(aircraft, onlyMissing) {
    const shape = shapeOf(aircraft.silhouette);
    aircraft.stations.filter(isGun).forEach(function (g, i) {
      if (onlyMissing && hasPosition(g)) return;
      g.x = round(VIEW.cx + shape.gun[0] + (shape.gun[0] < 0 ? -1 : 1) * 18 * i);
      g.y = round(shape.gun[1] + 14 * i);
    });
  }

  function locationOf(x) {
    if (Math.abs(x - VIEW.cx) <= CENTER_TOLERANCE) return 'CENTER';
    return x < VIEW.cx ? 'LEFT' : 'RIGHT';
  }

  /* Offset of a side station (e.g. 5L, 5R) from its parent station. */
  function sideOffset(side, siblings) {
    if (side.suffix === 'L') return [-24, 6];
    if (side.suffix === 'R') return [24, 6];
    const others = siblings.filter(function (x) { return x.suffix !== 'L' && x.suffix !== 'R'; });
    return [0, 26 + 20 * Math.max(0, others.indexOf(side))];
  }

  function sidesOf(aircraft, parent) {
    return aircraft.stations.filter(function (s) { return s.parentId === parent.id; });
  }

  function placeSides(aircraft, parent) {
    const sides = sidesOf(aircraft, parent);
    sides.forEach(function (side) {
      const o = sideOffset(side, sides);
      side.x = round(parent.x + o[0]);
      side.y = round(parent.y + o[1]);
    });
  }

  /*
   * Default layout (main stations only): left stations from wing tip to root, centre stations along
   * the fuselage, right stations from root to wing tip. Order within a group is list order.
   */
  function autoLayout(aircraft) {
    const shape = shapeOf(aircraft.silhouette);
    const groups = { LEFT: [], CENTER: [], RIGHT: [] };
    aircraft.stations.filter(isMain).forEach(function (s) { (groups[s.location] || groups.CENTER).push(s); });
    const along = function (t) {
      const r = shape.wing.root, tip = shape.wing.tip;
      return [r[0] + (tip[0] - r[0]) * t, r[1] + (tip[1] - r[1]) * t];
    };
    const spread = function (n, i) { return n === 1 ? 0.6 : 1 - i * 0.85 / (n - 1); };
    const out = {};
    groups.LEFT.forEach(function (s, i) {
      const p = along(spread(groups.LEFT.length, i));
      out[s.id] = { x: round(VIEW.cx - p[0]), y: round(p[1]) };
    });
    groups.RIGHT.forEach(function (s, i) {
      const n = groups.RIGHT.length;
      const p = along(spread(n, n - 1 - i));
      out[s.id] = { x: round(VIEW.cx + p[0]), y: round(p[1]) };
    });
    groups.CENTER.forEach(function (s, i) {
      const n = groups.CENTER.length;
      const y = n === 1 ? (shape.body.y1 + shape.body.y2) / 2 : shape.body.y1 + (shape.body.y2 - shape.body.y1) * i / (n - 1);
      out[s.id] = { x: VIEW.cx, y: round(y) };
    });
    return out;
  }

  function hasPosition(s) { return typeof s.x === 'number' && typeof s.y === 'number'; }

  /* Gives stations without a position a default one; returns true if anything changed. */
  function ensurePositions(aircraft) {
    let changed = false;
    const mains = aircraft.stations.filter(isMain);
    if (aircraft.stations.some(function (s) { return isGun(s) && !hasPosition(s); })) { placeGuns(aircraft, true); changed = true; }
    if (mains.some(function (s) { return !hasPosition(s); })) {
      const layout = autoLayout(aircraft);
      mains.forEach(function (s) {
        if (!hasPosition(s)) { s.x = layout[s.id].x; s.y = layout[s.id].y; changed = true; }
      });
    }
    mains.forEach(function (m) {
      if (sidesOf(aircraft, m).some(function (s) { return !hasPosition(s); })) {
        const keep = sidesOf(aircraft, m).filter(hasPosition).map(function (s) { return [s, s.x, s.y]; });
        placeSides(aircraft, m);
        keep.forEach(function (k) { k[0].x = k[1]; k[0].y = k[2]; });
        changed = true;
      }
    });
    return changed;
  }

  /* Auto layout; when locations is given only stations in those groups (LEFT/CENTER/RIGHT) move. */
  function applyAutoLayout(aircraft, locations) {
    const layout = autoLayout(aircraft);
    if (!locations) placeGuns(aircraft, false);
    aircraft.stations.filter(isMain).forEach(function (s) {
      if (locations && locations.indexOf(s.location) < 0) return;
      s.x = layout[s.id].x; s.y = layout[s.id].y;
      placeSides(aircraft, s);
    });
    arrangeStations(aircraft);
  }

  const SUFFIX_ORDER = { L: 0, R: 1 };
  function suffixCompare(a, b) {
    const ra = a.suffix in SUFFIX_ORDER ? SUFFIX_ORDER[a.suffix] : 2;
    const rb = b.suffix in SUFFIX_ORDER ? SUFFIX_ORDER[b.suffix] : 2;
    return ra - rb || String(a.suffix).localeCompare(String(b.suffix));
  }

  /*
   * Sorts and numbers stations left to right: main stations 1..N (by x, then y), side stations get
   * parent number + suffix (5L, 5R). Location (left/centre/right) is derived from x. The list order
   * is updated too (each main station followed by its side stations).
   * Returns true if order or codes changed.
   */
  function arrangeStations(aircraft) {
    ensurePositions(aircraft);
    const before = aircraft.stations.map(function (s) { return s.id + ':' + s.code + ':' + s.location; }).join('|');
    const byId = {};
    aircraft.stations.forEach(function (s) { byId[s.id] = s; });
    // Side stations whose parent was deleted become independent stations.
    aircraft.stations.forEach(function (s) {
      const parent = s.parentId ? byId[s.parentId] : null;
      if (s.parentId && (!parent || parent.parentId || isGun(parent))) { s.parentId = null; s.suffix = ''; }
      if (isGun(s)) { s.parentId = null; s.suffix = ''; }
    });
    const mains = aircraft.stations.filter(isMain).sort(function (a, b) { return a.x - b.x || a.y - b.y; });
    const ordered = [];
    mains.forEach(function (m, i) {
      m.code = String(i + 1);
      m.location = locationOf(m.x);
      ordered.push(m);
      sidesOf(aircraft, m).sort(suffixCompare).forEach(function (side) {
        side.code = m.code + side.suffix;
        side.location = locationOf(side.x);
        ordered.push(side);
      });
    });
    // Guns are unnumbered: GUN when there is one, otherwise GUN1, GUN2... left to right.
    const guns = aircraft.stations.filter(isGun).sort(function (a, b) { return a.x - b.x || a.y - b.y; });
    guns.forEach(function (g, i) {
      g.code = guns.length === 1 ? 'GUN' : 'GUN' + (i + 1);
      g.location = locationOf(g.x);
      ordered.push(g);
    });
    aircraft.stations.splice.apply(aircraft.stations, [0, aircraft.stations.length].concat(ordered));
    const after = aircraft.stations.map(function (s) { return s.id + ':' + s.code + ':' + s.location; }).join('|');
    return before !== after;
  }

  /*
   * Mirror station across the centre line (e.g. 3 <-> 7, 5L <-> 5R): the station of the same kind
   * (main / side) closest to the mirrored position and at most 40 units away; otherwise null.
   */
  function mirrorOf(aircraft, st) {
    if (isGun(st) || !hasPosition(st) || Math.abs(st.x - VIEW.cx) <= CENTER_TOLERANCE / 2) return null;
    const tx = 2 * VIEW.cx - st.x;
    let best = null, bestD = 40;
    aircraft.stations.forEach(function (s) {
      if (s === st || isGun(s) || !!s.parentId !== !!st.parentId || !hasPosition(s)) return;
      const d = Math.hypot(s.x - tx, s.y - st.y);
      if (d <= bestD) { best = s; bestD = d; }
    });
    return best;
  }

  function round(v) { return Math.round(v * 10) / 10; }

  return {
    VIEW: VIEW,
    SHAPES: SHAPES,
    shapeOf: shapeOf,
    outlinePath: outlinePath,
    autoLayout: autoLayout,
    ensurePositions: ensurePositions,
    applyAutoLayout: applyAutoLayout,
    arrangeStations: arrangeStations,
    placeSides: placeSides,
    sidesOf: sidesOf,
    isMain: isMain,
    mirrorOf: mirrorOf,
    isGun: isGun,
    locationOf: locationOf,
  };
});
</script>
  <script>
/*

(function () {

    catalogGroup: '',
    presetId: null,

  }

  // 24x24 line icons.
  const ICONS = {

    spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z',
    grid: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',

    alert: 'M12 3.5l9.5 16.5h-19zM12 10v4.5M12 17.2v.3',

    info: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M12 11v6M12 7.5v.3',

    layers: 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5',

    print: 'M7 9V3.5h10V9M7 17H4.5V9.5h15V17H17M7 14h10v6.5H7z',
    mirror: 'M12 3v18M8 7l-5 5 5 5V7zM16 7l5 5-5 5V7z',

  };

  function icon(name, cls) {
    const filled = name === 'plane';
    return svg('svg', { viewBox: '0 0 24 24', class: 'icon' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' }, [
      svg('path', { d: ICONS[name], fill: filled ? 'currentColor' : 'none', stroke: filled ? 'none' : 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }),

  function btn(label, opts) {

  /*
   * Undo / redo: on every save (a 250 ms burst of changes) the previous snapshot is pushed on the stack.
   * File: with the File System Access API the same file is overwritten; otherwise it is downloaded.

  const history = { undo: [], redo: [], last: null, limit: 150 };

  function commitHistory(cur) {

    clearTimeout(saveTimer);

  }

  function restore(json) {
    history.last = json;
    state.project = JSON.parse(json);

    if (!history.redo.length) return;
    history.undo.push(history.last);
    restore(history.redo.pop());
    toast('Redone.');

  /* Counts how often a store is used in load trees, presets and rules. */
  function usageCount(storeId) {

    (state.project.presets || []).forEach(function (preset) { preset.loads.forEach(walk); });

    { id: 'aircraft', label: 'Aircraft', icon: 'plane' },
